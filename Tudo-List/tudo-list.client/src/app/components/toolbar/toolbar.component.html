<mat-toolbar>
    <ng-content select="button"></ng-content>
    <span>{{ "titleWebApp" | translate }}</span>
    <span class="example-spacer"></span>
    <div class="profile">
        <p>{{user()?.name}}</p>
        <a href="/user">
            @if (imgProfile) {
                <img [src]="imgProfile" alt="user image">
            }@else {
                <mat-icon>account_circle</mat-icon>
            }
        </a>
    </div>
</mat-toolbar>
