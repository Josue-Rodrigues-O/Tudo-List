<table mat-table [dataSource]="tasks()" class="mat-elevation-z8">
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>{{ 'todoList.fields.title' | translate}}</th>
        <td mat-cell *matCellDef="let element"> {{element.title}} </td>
    </ng-container>

    <ng-container matColumnDef="priority">
        <th mat-header-cell *matHeaderCellDef class="column-status">{{ 'todoList.fields.priority' | translate}}</th>
        <td mat-cell *matCellDef="let element"> {{element.priority | priority}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="column-priority">{{ 'todoList.fields.status' | translate}}</th>
        <td mat-cell *matCellDef="let element"> {{element.status | status}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onClickTask(row)"></tr>
</table>
